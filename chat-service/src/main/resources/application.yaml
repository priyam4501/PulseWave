server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: ${SPRING_APP_NAME:chat-service}

  datasource:
    url: ${DB_URL}

    username: ${DB_USERNAME}

    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}