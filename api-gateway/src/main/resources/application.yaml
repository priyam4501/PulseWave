server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: ${SPRING_APP_NAME:api-gateway}

  cloud:
    gateway:
      routes:

        - id: auth-service

          uri: ${AUTH_SERVICE_URI:lb://AUTH-SERVICE}

          predicates:
            - Path=/auth/**

eureka:
  instance:
    hostname: localhost
    non-secure-port: ${SERVER_PORT:8085}
    instance-id: localhost:${spring.application.name}:${server.port}

  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG